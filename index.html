<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saraswati Traders Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1e293b',
                            red: '#991b1b',
                            redlight: '#fee2e2',
                            accent: '#b91c1c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-active { background-color: #991b1b; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-brand-dark px-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-brand-red">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">SARASWATI TRADERS</h1>
                <p class="text-xs font-semibold text-brand-accent tracking-widest uppercase mt-1">Dispatch Management System</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Select Your System Role</label>
                    <select id="login-role" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-red bg-slate-50 text-sm">
                        <option value="Admin">Admin Panel</option>
                        <option value="Staff">Staff Console</option>
                        <option value="Driver">Driver App</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Your Profile Name</label>
                    <input type="text" id="login-username" placeholder="e.g. Aryan Jesrani" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-red text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Numeric Password / PIN</label>
                    <input type="password" id="login-pass" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 1234" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-red text-sm" required>
                </div>
                <button type="submit" class="w-full bg-brand-red text-white py-3 rounded-lg font-medium text-sm hover:bg-brand-accent transition shadow-md">
                    Secure Log In
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <div id="app-layout" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <aside class="w-full md:w-64 bg-brand-dark text-slate-300 flex flex-col border-r border-slate-700 shadow-xl">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-900">
                <div>
                    <h2 class="text-sm font-bold text-white tracking-wide">SARASWATI DISPATCH</h2>
                    <span id="user-badge" class="text-[10px] bg-brand-red text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider mt-1 inline-block">Admin</span>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-white md:hidden"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
            
            <nav id="nav-links" class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                </nav>

            <div class="p-4 border-t border-slate-700 hidden md:block bg-slate-900">
                <button onclick="logout()" class="flex items-center space-x-3 w-full px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shadow-sm">
                <h2 id="page-title" class="text-lg
